name: engine-check

# Guards the Claude Code projection: .cursor/ is the source of truth, CLAUDE.md +
# .claude/skills/ are generated by scripts/sync_claude.py. If someone edits a rule
# or skill without regenerating, --check fails here (it also self-validates every
# generated skill's frontmatter). No "remember to re-run" — the mechanism enforces it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  claude-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Claude projection is in sync with .cursor/ (and valid)
        run: python3 scripts/sync_claude.py --check
